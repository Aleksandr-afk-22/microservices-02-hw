volumes:
  data:

services:
  storage:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    restart: always
    expose:
      - 9000
    environment:
      MINIO_ROOT_USER: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${Storage_Secret:-STORAGE_SECRET_KEY}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    restart: on-failure
    volumes:
      - ./init/policy.json:/tmp/policy.json:ro
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://storage:9000 s3 mb s3://${Storage_Bucket:-images} 2>&1 || echo 'bucket exists';
      aws --endpoint-url http://storage:9000 s3api put-bucket-policy --bucket ${Storage_Bucket:-images} --policy file:///tmp/policy.json;
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${Storage_Secret:-STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      
  uploader:
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    expose:
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${Storage_AccessKey:-STORAGE_ACCESS_KEY}
      S3_ACCESS_SECRET: ${Storage_Secret:-STORAGE_SECRET_KEY}
      S3_BUCKET: ${Storage_Bucket:-STORAGE_BUCKET}

  security:
    build: ./security
    expose:
      - 3000
    environment:
      PORT: 3000

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - storage
      - uploader
      - security